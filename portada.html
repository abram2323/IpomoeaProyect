<!-- JS para header que cambia tamaño -->
<script>
    window.addEventListener("scroll", function() {
        const header = document.querySelector("header");

        // Evita vibrar usando >= y <= y solo cuando cambia
        if (window.scrollY > 50 && !header.classList.contains("scrolled")) {
            header.classList.add("scrolled");
        } else if (window.scrollY <= 50 && header.classList.contains("scrolled")) {
            header.classList.remove("scrolled");
        }
    });
</script>

<!--JS para que la imagen tenga efecto de movimiento-->
<script>
    window.addEventListener('scroll', () => {
    const imagen = document.querySelector('.hero img');
    let scrollPos = window.pageYOffset;
    
    // Mueve la imagen ligeramente hacia arriba al bajar
    // El 0.5 controla la velocidad del efecto
    imagen.style.transform = `translateY(${scrollPos * 0.5}px)`;
});
</script>
